name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Trivy
        run: |
          # The apt-repo path used the retired keyring helper, which the current
          # ubuntu-latest image no longer ships (`command not found` on every run
          # from 2026-11-14). The upstream install script needs no keyring and
          # pins nothing else in this workflow.
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Run precommit checks
        run: make precommit
