name: Release

# Triggered when a GitHub Release is PUBLISHED — deliberately not on tag push.
#
# Every merge to master auto-tags, so a tag-triggered workflow would publish a
# Homebrew cask for every merge and bypass the scenario gate entirely. Promotion
# to a Release is the human gate: walk the scenarios, then `gh release create <tag>`.
# See docs/releasing-dark-factory.md.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # goreleaser needs full history + tags to resolve {{ .Tag }}.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: 'v2.17.0'
          args: release --clean
        env:
          # Attaches archives to the already-published Release on this repo
          # (.goreleaser.yaml sets release.mode: append).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the generated Homebrew cask to bborbe/homebrew-tap (cross-repo).
          # SECURITY: fine-grained PAT scoped to ONLY the homebrew-tap repo with
          # Contents: Read and write (nothing else). This limits blast radius if the
          # secret leaks — a compromised token can only touch the tap, not this repo.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
