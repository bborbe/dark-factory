version: 2

project_name: dark-factory

builds:
  - id: dark-factory
    binary: dark-factory
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/bborbe/dark-factory/pkg/version.Version={{ .Tag }}

archives:
  - id: dark-factory
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: bborbe
    name: dark-factory

  # `mode` governs the release NOTES only — it has nothing to do with artifacts.
  # This workflow is triggered by `release: published`, so the Release already
  # exists with notes taken from CHANGELOG.md by the promotion step. Keep them:
  # `append` stacked goreleaser's generated commit list underneath on EVERY run,
  # so three attempts at v0.193.0 left three copies in the body.
  mode: keep-existing

  # Retry safety. Assets are uploaded before the cask step, so a run that fails
  # at the cask leaves them behind, and the next attempt dies with
  # `422 Validation Failed [Code:already_exists]` — requiring the assets to be
  # deleted by hand before any retry can work. This makes goreleaser delete and
  # re-upload on 422 instead. THIS is the artifact-level setting; `mode` is not.
  replace_existing_artifacts: true

homebrew_casks:
  - name: dark-factory
    description: "Spec-driven autonomous code generation pipeline"
    homepage: "https://github.com/bborbe/dark-factory"
    repository:
      owner: bborbe
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaser-bot
      email: goreleaser@benjamin-borbe.de
    # The binary is unsigned; strip the download quarantine so it runs without a
    # Gatekeeper "unidentified developer" prompt on first use.
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dark-factory"]
